<article id="login_div" class="login-card animate-slide-in">
  <header class="login-card__header">
    <span class="login-card__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false">
        <path fill="currentColor" d="M17 10h-1V8a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4Zm7 12H7v-8h10Z" />
      </svg>
    </span>
    <h1>{LNG_Login}</h1>
    <p>{LNG_Login intro}</p>
  </header>
  <form id="login_frm" method="post" autocomplete="off">
    <fieldset class="fields">
      <label class="field" for="login_username">
        <span class="field__label">{PLACEHOLDER}</span>
        <span class="field__control">
          <span class="field__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path fill="currentColor" d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-3.32 0-9 1.67-9 5v1h18v-1c0-3.33-5.68-5-9-5Z" />
            </svg>
          </span>
          <input type="text" name="login_username" id="login_username" value="{EMAIL}" maxlength="255" placeholder="{PLACEHOLDER}" title="{PLACEHOLDER}">
        </span>
      </label>
      <label class="field" for="login_password">
        <span class="field__label">{LNG_Password}</span>
        <span class="field__control">
          <span class="field__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path fill="currentColor" d="M17 10h-1V8a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4Zm7 12H7v-8h10Z" />
            </svg>
          </span>
          <input class="showpassword" type="password" name="login_password" id="login_password" value="{PASSWORD}" maxlength="50" placeholder="{LNG_Password}" title="{LNG_Password}">
        </span>
      </label>
    </fieldset>
    <fieldset class="actions">
      <label class="remember"><input type="checkbox" name="login_remember" id="login_remember" value="1" {REMEMBER}>{LNG_Remember me}</label>
      <button type="submit" class="button login">{LNG_Login}</button>
      <FACEBOOK>
        <button type="button" class="button facebook" id="facebook_login">
          <span class="field__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M13 10h2.5l-.35 2.5H13V21h-3v-8.5H8v-2.5h2V8.75C10 6.68 11.05 5 13.65 5H16v2.5h-1.6c-.94 0-1.4.28-1.4 1.05Z" /></svg>
          </span>
          Login with Facebook
        </button>
        <script>initFacebookButton('facebook_login')</script>
      </FACEBOOK>
      <div id="google_login"></div>
      {LINELOGIN}
      <div class="telegram-login">{TELEGRAMLOGIN}</div>
    </fieldset>
    <fieldset class="center">
      {LOGINMENU}
      <input type="hidden" name="token" id="token" value="{TOKEN}">
      <input type="hidden" name="login_action" id="login_action" value="{URL}">
    </fieldset>
  </form>
  <script>
    new GForm('login_frm', 'index.php/index/model/login/chklogin').onsubmit(doFormSubmit);
  </script>
  {LOGIN_MESSAGE}
</article>
